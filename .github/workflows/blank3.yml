
name: 2 Tailscale - Docker fix đơ

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Chuẩn bị Tailscale và Dropbear
        run: |
          sudo apt update -y
          sudo apt install -y wget curl dropbear

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up

          echo "Thiết lập mật khẩu SSH..."

          RUNNER_USER="$(whoami)"
          echo "${RUNNER_USER}:@1234" | sudo chpasswd

          echo "Khởi động Dropbear..."
          sudo dropbear -p 22

          echo "SSH username: ${RUNNER_USER}"
          echo "SSH password: @1234"

          echo "===== TAILSCALE IP ====="
          tailscale ip -4

          echo "===== DROPBEAR ====="
          sudo ss -lntp | grep ':22'

      - name: Cài Windows và khởi chạy
        run: |
          sudo chmod 666 /dev/kvm
          sudo mkdir -p /isos/

          sudo wget -O /isos/vb.iso \
            https://github.com/meovncute/yail/raw/refs/heads/main/vb.iso

          sudo wget -O /isos/driver.iso \
            https://fedorapeople.org/groups/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.285-1/virtio-win-0.1.285.iso \
            &>/dev/null &

          while ps axg | grep -vw grep | grep -w wget > /dev/null; do
            sleep 1
          done

          wget -O compose.yaml \
            https://github.com/meovncute/yail/raw/refs/heads/main/.github/workflows/compose.yml

          wget -O loop.sh \
            https://github.com/Efebey2903/GH-Ubuntu-Desktop/raw/main/loop.sh

          bash loop.sh &>/dev/null &

          echo "Tailscale IP:"
          tailscale ip -4

          echo "Khởi động Windows..."
          sudo docker compose up -d

          echo "Thành công. Kết nối bằng port 8006."

      - name: Tạo file res.sh
        run: |
          cat > res.sh <<'EOF'
          #!/bin/bash

          echo "================================"
          echo "   RESTART WINDOWS DOCKER"
          echo "================================"

          sudo docker restart windows

          echo ""
          echo "===== DOCKER STATUS ====="
          sudo docker ps --filter name=windows

          echo "Hoàn tất!"
          EOF

          chmod +x res.sh

          echo "Đã tạo res.sh thành công."

      - name: Khởi động SSHX dự phòng
        run: |
          echo "Cài đặt SSHX..."

          curl -sSf https://sshx.io/get | sh

          echo "Khởi chạy SSHX..."

          nohup sshx > sshx.log 2>&1 &

          sleep 5

          echo "===== SSHX STATUS ====="
          pgrep -af sshx || true

          echo "===== SSHX LOG ====="
          cat sshx.log || true

      - name: Giữ GitHub Actions hoạt động và tự sửa SSH
        run: |
          echo "================================"
          echo "Windows đang chạy"
          echo "Tailscale IP:"
          tailscale ip -4
          echo "Dropbear SSH: port 22"
          echo "Web: http://$(tailscale ip -4):8006"
          echo "SSHX: xem log ở bước SSHX"
          echo "================================"

          while true; do
            echo ""
            echo "===== DROPBEAR CHECK ====="

            if ! timeout 3 bash -c '</dev/tcp/127.0.0.1/22' 2>/dev/null; then
              echo "SSH lỗi! Đang khởi động lại Dropbear..."

              sudo pkill -x dropbear || true
              sleep 2
              sudo dropbear -p 22
            else
              echo "Dropbear đang hoạt động."
            fi

            echo ""
            echo "===== DOCKER ====="
            sudo docker ps --filter name=windows

            echo ""
            echo "===== SSHX ====="

            if pgrep -af '[s]shx' >/dev/null; then
              echo "SSHX đang chạy."
            else
              echo "SSHX bị dừng!"
              nohup sshx >> sshx.log 2>&1 &
            fi

            echo ""
            echo "Kiểm tra tiếp theo sau 5 phút..."
            sleep 300
          done
